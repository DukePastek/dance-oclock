<form class="actu-form" (ngSubmit)="submit()">
  <h1>{{ isEditMode() ? "Modifier l'actu" : 'Nouvelle actu' }}</h1>

  <mat-form-field appearance="outline">
    <mat-label>Titre</mat-label>
    <input matInput type="text" name="title" [(ngModel)]="model.title" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Résumé</mat-label>
    <textarea matInput name="summary" rows="2" [(ngModel)]="model.summary" required></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Contenu</mat-label>
    <textarea matInput name="content" rows="8" [(ngModel)]="model.content" required></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Type</mat-label>
    <mat-select name="type" [(ngModel)]="model.type">
      @for (type of actuTypes; track type) {
        <mat-option [value]="type">{{ type }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>URL image</mat-label>
    <input matInput type="text" name="imageUrl" [(ngModel)]="model.imageUrl" />
  </mat-form-field>

  <mat-checkbox name="isPublished" [(ngModel)]="model.isPublished">Publié</mat-checkbox>

  <button mat-flat-button color="primary" type="submit">Enregistrer</button>
</form>
