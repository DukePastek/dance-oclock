<div class="admin-toolbar">
  <h1>Actus</h1>
  <a mat-flat-button color="primary" routerLink="/admin/actus/nouvelle">+ Nouvelle actu</a>
</div>

<div class="table-scroll">
  <table mat-table [dataSource]="actus()" class="admin-table">
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Titre</th>
      <td mat-cell *matCellDef="let actu">{{ actu.title }}</td>
    </ng-container>

    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef>Type</th>
      <td mat-cell *matCellDef="let actu">{{ actu.type }}</td>
    </ng-container>

    <ng-container matColumnDef="isPublished">
      <th mat-header-cell *matHeaderCellDef>Publié</th>
      <td mat-cell *matCellDef="let actu">{{ actu.isPublished ? 'Oui' : 'Non' }}</td>
    </ng-container>

    <ng-container matColumnDef="publishedAt">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let actu">{{ actu.publishedAt | date: 'dd/MM/yyyy' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let actu" class="actions">
        <a mat-icon-button [routerLink]="['/admin/actus', actu.id]" aria-label="Modifier">
          <mat-icon>edit</mat-icon>
        </a>
        <button
          mat-icon-button
          type="button"
          class="delete-btn"
          (click)="remove(actu)"
          aria-label="Supprimer"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
